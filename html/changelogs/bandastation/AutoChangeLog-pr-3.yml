author: "YesImMorty"
delete-after: True
changes:
  - bugfix: "Крю-монитор снова показывает статус \"Мёртв\""
  - bugfix: "ПИИ может пользоваться крю-монитором из платы"
  - bugfix: "Дубликатор интегральных схем снова печатает сохранённые схемы"
  - bugfix: "Мобы на плечах не издают звук ползания"
  - bugfix: "Кастомные эмоции в рацию у ИИ и мобов со встроенной рацией снова работают"
  - bugfix: "Ядерный диск выкладывается рядом с криоподом при уходе владельца в криосон"
  - bugfix: "Уведомления об ответах в тикетах получает только стафф с доступом к ним"
  - bugfix: "Время в тикетах показывается в часовом поясе клиента"
  - bugfix: "Админ с невалидным рангом больше не ломает панель прав"
  - sound: "Тише СМ, ХФР, часы и шаги мод-ботинок, меньше цепных зевков"